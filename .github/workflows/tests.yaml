name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck php-cli

          curl -OL https://squizlabs.github.io/PHP_CodeSniffer/phpcbf.phar
          sudo mv phpcbf.phar /usr/local/bin/phpcbf
          sudo chmod +x /usr/local/bin/phpcbf

          # Install hadolint for Dockerfile linting
          wget -qO /tmp/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo install /tmp/hadolint /usr/local/bin/hadolint

          # Install shfmt for shell formatting
          wget -qO /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.11.0/shfmt_v3.11.0_linux_amd64
          sudo install /tmp/shfmt /usr/local/bin/shfmt

      - run: pip install pre-commit

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - run: docker build -t stateseparator .

      - run: ./tests/test_docker.sh stateseparator

      - run: ./tests/test_calculate_security.sh stateseparator

      - run: |
          docker run --rm -v ${{ github.workspace }}/tests:/tests stateseparator \
            /tests/test_separator.sh /var/www/html/NSeparator /var/www/html/NRandomizer
